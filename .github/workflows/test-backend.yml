name: Backend tests

on:
  push:
    branches:
      - main
    paths:
      - "accounts/**"
      - "api/**"
      - "tickets/**"
      - "config/**"
      - "manage.py"
      - "pytest.ini"
      - "requirements.txt"
      - ".github/workflows/test-backend.yml"

  pull_request:
    branches:
      - main
    paths:
      - "accounts/**"
      - "api/**"
      - "tickets/**"
      - "config/**"
      - "manage.py"
      - "pytest.ini"
      - "requirements.txt"
      - ".github/workflows/test-backend.yml"

  workflow_dispatch:

concurrency:
  group: backend-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ticketfast
          POSTGRES_PASSWORD: ticketfast
          POSTGRES_DB: ticketfast_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ticketfast"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Django system checks
        env:
          DJANGO_SECRET_KEY: github-actions-test-key
          DEBUG: False
          DATABASE_URL: postgres://ticketfast:ticketfast@localhost:5432/ticketfast_test
          DJANGO_DB_SSL_REQUIRE: False
        run: python manage.py check

      - name: Run migrations
        env:
          DJANGO_SECRET_KEY: github-actions-test-key
          DEBUG: False
          DATABASE_URL: postgres://ticketfast:ticketfast@localhost:5432/ticketfast_test
          DJANGO_DB_SSL_REQUIRE: False
        run: python manage.py migrate

      - name: Run pytest
        env:
          DJANGO_SECRET_KEY: github-actions-test-key
          DEBUG: False
          DATABASE_URL: postgres://ticketfast:ticketfast@localhost:5432/ticketfast_test
          DJANGO_DB_SSL_REQUIRE: False
        run: pytest -q