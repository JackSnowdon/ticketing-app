services:
  db:
    image: postgres:17
    container_name: ticketing-db
    environment:
      POSTGRES_DB: ticketing
      POSTGRES_USER: ticketing
      POSTGRES_PASSWORD: ticketing
    ports:
      - "5432:5432"
    volumes:
      - ticketing_postgres_data:/var/lib/postgresql/data

volumes:
  ticketing_postgres_data: